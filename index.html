<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive, glassmorphism-style login page built with HTML, CSS, and vanilla JavaScript.">
    <title>Login | Modern Auth UI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="icon">✦</div>
            <h1>Welcome Back</h1>
            <p>Sign in to continue to your dashboard</p>
        </div>

        <!-- id="loginForm" lets script.js hook into this form -->
        <form id="loginForm" novalidate>
            <div class="field">
                <label for="email">Email Address</label>
                <input id="email" name="email" type="email" placeholder="name@example.com" required>
                <span class="error-text" id="emailError"></span>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter your password" required minlength="6">
                <span class="error-text" id="passwordError"></span>
            </div>

            <div class="row">
                <label><input type="checkbox" id="rememberMe"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" id="submitBtn">Sign In</button>
        </form>

        <div class="footer">
            Don't have an account? <a href="#">Create one</a>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
